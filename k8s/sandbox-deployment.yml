apiVersion: apps/v1
kind: Deployment
metadata:
  name:  sandbox-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app:  sandbox-server
  template:
    metadata:
      labels:
        app:  sandbox-server
    spec:
      serviceAccountName: resource-manager
      containers:
      - name: sandbox-container
        image:  sandbox:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort:  3000
        resources:
          limits:
            cpu: "500m"
            memory: "500Mi"
          requests:
            cpu: "250m"
            memory: "250Mi"
        livenessProbe:
          httpGet:
            path: /api/sandbox/health
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/sandbox/health
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10      
        